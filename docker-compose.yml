version: "3.8"

services:
  evolution-api:
    image: atendai/evolution-api:latest
    container_name: evolution_api
    ports:
      - "8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    environment:
      # Configurações Base
      - SERVER_URL=http://localhost:8080
      - DOCKER_ENV=true
      - LOG_LEVEL=CLIENT,ERROR,INFO

      # Segurança (A mesma chave que colocamos no .env do nosso service-ia)
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=ReservasClub_Secret_Key_123

      # Banco de dados interno APENAS para a Evolution gerenciar as sessões do WhatsApp
      - DATABASE_PROVIDER=sqlite
    restart: always

volumes:
  evolution_instances:
  evolution_store:
